<title id="t">Energia e dados no Ponto do Tear</title><desc id="d">A rede alimenta a iluminação. Na alternativa solar os módulos e o microinversor também alimentam o circuito. O cadastro, as premissas e o medidor proposto fornecem dados para o cálculo e o painel.</desc>
